contract = 1
id = "tools"
name = "MCP server, stdio"
description = "An MCP server over stdio with two example tools and tests that call them through an in-process client session."
version = "1"
kind = "service"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
dependencies = ["mcp>=2.3,<3"]
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "Tools run with the server's own permissions. The example tools read only their input. Nothing is authenticated: the server trusts whichever MCP client launches it over stdio. The project needs no secrets, network, or services, and the checks do not review what your own tools do."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
